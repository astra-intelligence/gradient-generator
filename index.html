<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator — Free Tool</title>
    <meta name="description" content="Free online CSS gradient generator. Pick colors, adjust angle, get ready-to-use CSS code. Perfect for Tailwind CSS projects.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold text-center mb-2">CSS Gradient Generator</h1>
        <p class="text-gray-400 text-center mb-8">Pick colors, get code. Free.</p>
        <div id="preview" class="h-48 rounded-2xl mb-8 border border-gray-700" style="background: linear-gradient(135deg, #6c5ce7, #00cec9);"></div>
        
        <div class="grid grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Color 1</label>
                <input type="color" id="color1" value="#6c5ce7" class="w-full h-12 rounded-xl cursor-pointer bg-gray-800 border border-gray-700">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">Color 2</label>
                <input type="color" id="color2" value="#00cec9" class="w-full h-12 rounded-xl cursor-pointer bg-gray-800 border border-gray-700">
            </div>
        </div>
        
        <div class="mb-8">
            <label class="block text-sm text-gray-400 mb-2">Angle: <span id="angle-value">135</span>°</label>
            <input type="range" id="angle" min="0" max="360" value="135" class="w-full accent-indigo-500">
        </div>
        
        <div class="bg-gray-900 rounded-xl p-4 mb-6 font-mono text-sm">
            <div id="css-output" class="text-green-400 whitespace-pre-wrap">background: linear-gradient(135deg, #6c5ce7, #00cec9);</div>
            <button id="copy-btn" class="mt-3 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 transition font-sans">Copy CSS</button>
        </div>

        <div class="bg-gray-900 rounded-xl p-6 text-center">
            <p class="text-gray-400 text-sm mb-2">Need a full landing page with gradients like this?</p>
            <a href="https://grantshatz.gumroad.com/l/uccaws" class="text-indigo-400 hover:text-indigo-300 font-medium underline">Get the SaaS UI Kit → 10 premium Tailwind components for $5</a>
        </div>
        
        <footer class="mt-12 text-center text-gray-600 text-xs">
            <p>A free tool by Adventure Agent • <a href="https://github.com/astra-intelligence/saas-ui-kit" class="underline hover:text-gray-400">GitHub</a></p>
        </footer>
    </div>
    
    <script>
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const angle = document.getElementById('angle');
        const preview = document.getElementById('preview');
        const output = document.getElementById('css-output');
        const angleVal = document.getElementById('angle-value');
        const copyBtn = document.getElementById('copy-btn');
        
        function update() {
            const css = `background: linear-gradient(${angle.value}deg, ${color1.value}, ${color2.value});`;
            preview.style.background = css.replace('background: ', '');
            output.textContent = css;
            angleVal.textContent = angle.value;
        }
        
        color1.addEventListener('input', update);
        color2.addEventListener('input', update);
        angle.addEventListener('input', update);
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(output.textContent);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy CSS', 1500);
        });
    </script>
</body>
</html>deploy
